<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Műhely Vezérlőpult</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0a0a0a; color: #fff; padding: 20px; }
        
        .header { text-align: center; margin-bottom: 25px; color: #ff6600; font-size: 28px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        .dashboard { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; }
        .main-panel { flex: 2; min-width: 320px; background-color: #d95b00; padding: 20px; border-radius: 12px; }
        .side-panel { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 20px; }
        
        .card { background-color: #d95b00; padding: 20px; border-radius: 12px; }
        .card-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid rgba(255,255,255,0.2); padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        
        /* Tabok */
        .tabs { display: flex; background-color: #a34300; border-radius: 6px; overflow: hidden; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #fff; font-weight: bold; cursor: pointer; text-align: center; }
        .tab-btn.active { background-color: #ff6600; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Form elemek */
        label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 12px; background-color: #000; border: 1px solid #333; color: #fff; border-radius: 6px; margin-bottom: 15px; font-size: 15px; }
        
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 14px; }
        .checkbox-group input { width: 18px; height: 18px; }

        /* Gombok */
        .btn-main { width: 100%; padding: 14px; background-color: #000; color: #ff6600; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .btn-main:hover { background-color: #111; }
        
        .sync-group { display: flex; gap: 10px; }
        .btn-sync { flex: 1; padding: 12px; background-color: #000; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-status { flex: 1; padding: 12px; background-color: #1b5e20; color: #fff; border: none; border-radius: 6px; font-weight: bold; text-align: center; }

        /* Táblázat */
        table { width: 100%; border-collapse: collapse; background-color: #000; border-radius: 6px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #222; }
        th { background-color: #111; color: #ff6600; }
        .btn-del { background-color: #c62828; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }

        /* Rádió Vezérlő */
        .radio-controls { display: flex; align-items: center; gap: 15px; margin-top: 15px; }
        .btn-play { background-color: #000; border: none; width: 45px; height: 45px; border-radius: 50%; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .volume-slider { flex: 1; }
        .radio-status { font-size: 12px; margin-top: 8px; opacity: 0.8; text-align: right; }
        .radio-link-btn { display: block; text-align: center; background-color: #000; color: #ff6600; padding: 8px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">🛠️ MŰHELY VEZÉRLŐPULT</div>

    <div class="dashboard">
        <!-- BAL OLDAL: LELTÁR -->
        <div class="main-panel">
            <div class="card-title">📋 Leltár Rendszer</div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('addTab', this)">Hozzáadás</button>
                <button class="tab-btn" onclick="switchTab('listTab', this)">Lista</button>
                <button class="tab-btn" onclick="switchTab('useTab', this)">Felhasználás</button>
            </div>

            <!-- TAB 1: HOZZÁADÁS -->
            <div id="addTab" class="tab-content active">
                <form onsubmit="addItem(event)">
                    <label>Tétel megnevezése:</label>
                    <input type="text" id="itemName" placeholder="Pl.: 6x40-es facsavar" required>

                    <label>Mennyiség (1 - 1000):</label>
                    <input type="number" id="itemQty" min="1" value="1" required>

                    <div class="checkbox-group">
                        <input type="checkbox" id="isMinAlert">
                        <label for="isMinAlert" style="margin:0;">Ez egy fogyóeszköz (Figyelmeztessen, ha 15 db alá esik!)</label>
                    </div>

                    <button type="submit" class="btn-main">+ HOZZÁADÁS A LELTÁRHOZ</button>
                </form>
            </div>

            <!-- TAB 2: LISTA -->
            <div id="listTab" class="tab-content">
                <table>
                    <thead>
                        <tr>
                            <th>Név</th>
                            <th>Mennyiség</th>
                            <th>Művelet</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryList"></tbody>
                </table>
            </div>

            <!-- TAB 3: FELHASZNÁLÁS -->
            <div id="useTab" class="tab-content">
                <label>Válassz tételt:</label>
                <select id="useSelect"><option value="">-- Válassz --</option></select>

                <label>Levonandó mennyiség:</label>
                <input type="number" id="useQty" min="1" value="1">

                <button class="btn-main" onclick="useItem()">➖ KIVÉTEL A LELTÁRBÓL</button>
            </div>

            <div class="sync-group">
                <button class="btn-sync" onclick="loadFromCloud(true)">🔄 Adatok frissítése felhőből</button>
                <div class="btn-status" id="statusBtn">☁️ Felhő szinkron aktív</div>
            </div>
        </div>

        <!-- JOBB OLDAL: IDŐJÁRÁS ÉS RÁDIÓ -->
        <div class="side-panel">
            <!-- ÉLŐ IDŐJÁRÁS KÁRTYA -->
            <div class="card">
                <div class="card-title">🌤️ Atkár Időjárás</div>
                <div id="weatherTemp" style="font-size: 24px; font-weight: bold; margin-top: 10px;">Betöltés...</div>
                <div id="weatherDesc" style="font-size: 14px; opacity: 0.9;">Atkár</div>
            </div>

            <!-- RÁDIÓ KÁRTYA ROBUSTUS HTTPS ÉS DIRECT ADATFOLYAMOKKAL -->
            <div class="card">
                <div class="card-title">📻 Műhely Rádió</div>
                <label for="radioSelect" style="display:none;">Adó választása</label>
                <select id="radioSelect" onchange="changeStream()">
                    <option value="https://icast.connectmedia.hu/5201/live.mp3" data-url="https://radio1.hu">Rádió 1 (Közvetlen Stream)</option>
                    <option value="https://icast.connectmedia.hu/5001/live.mp3" data-url="https://retroradio.hu">Retro Rádió</option>
                    <option value="https://icast.connectmedia.hu/4738/mr2.mp3" data-url="https://petofiradio.hu">Petőfi Rádió</option>
                    <option value="https://stream.slagerfm.hu/slagerfm.mp3" data-url="https://slagerfm.hu">Sláger FM</option>
                    <option value="https://stream.live.vc.bbcmedia.co.uk/bbc_radio_one" data-url="https://www.bbc.co.uk/sounds/play/live:bbc_radio_one">BBC Radio 1</option>
                </select>

                <div class="radio-controls">
                    <button class="btn-play" id="playBtn" onclick="toggleRadio()">▶</button>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" oninput="setVolume(this.value)">
                </div>

                <div id="radioStatus" class="radio-status">Állapot: Kész</div>

                <audio id="radioAudio" preload="none"></audio>

                <a id="externalRadioBtn" href="https://radio1.hu" target="_blank" class="radio-link-btn">
                    🔗 Hivatalos webes lejátszó megnyitása
                </a>
            </div>
        </div>
    </div>

<script>
// --- FELHŐ KONFIGURÁCIÓ ---
const BIN_ID = '6a845628f5f4af5e29244f66';
const MASTER_KEY = '$2a$10$6QowppR7Ydwg4yuY2y0QaueS2z3gX5GIkmndr9G4hqNMXuhjmXYCO';

let inventory = JSON.parse(localStorage.getItem('muhely_leltar')) || [];

// --- TÁBLÁZAT ÉS LISTÁK MEGJELENÍTÉSE ---
function renderUI() {
    const tbody = document.getElementById('inventoryList');
    const select = document.getElementById('useSelect');
    
    tbody.innerHTML = '';
    select.innerHTML = '<option value="">-- Válassz --</option>';

    if (inventory.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Üres leltár.</td></tr>';
        return;
    }

    inventory.forEach(item => {
        const currentQty = item.quantity ?? item.qty ?? item.mennyiseg ?? 1;
        const isLow = item.isMinAlert && currentQty <= 15;
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><strong>${escapeHtml(item.name)}</strong></td>
            <td style="color: ${isLow ? '#ff4444' : '#fff'}; font-weight: ${isLow ? 'bold' : 'normal'};">
                ${currentQty} db ${isLow ? '⚠️ (Kevés!)' : ''}
            </td>
            <td><button class="btn-del" onclick="deleteItem(${item.id})">Törlés</button></td>
        `;
        tbody.appendChild(tr);

        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = `${item.name} (${currentQty} db)`;
        select.appendChild(opt);
    });
}

// --- ÉLŐ IDŐJÁRÁS ATKÁRRA ---
async function fetchWeather() {
    try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=47.72&longitude=19.98&current=temperature_2m,weather_code');
        const data = await res.json();
        
        const temp = Math.round(data.current.temperature_2m);
        const code = data.current.weather_code;
        
        const tempEl = document.getElementById('weatherTemp');
        const descEl = document.getElementById('weatherDesc');
        
        if (tempEl) tempEl.textContent = `${temp} °C`;
        if (descEl) descEl.textContent = `${getWeatherText(code)} (Atkár)`;
    } catch (err) {
        console.error("Időjárás hiba:", err);
    }
}

function getWeatherText(code) {
    if (code === 0) return 'Derűs, napos';
    if (code >= 1 && code <= 3) return 'Gomolyfelhős';
    if (code >= 45 && code <= 48) return 'Ködös';
    if (code >= 51 && code <= 67) return 'Esős';
    if (code >= 71 && code <= 77) return 'Havazás';
    if (code >= 80 && code <= 82) return 'Zápor';
    if (code >= 95) return 'Zivatar';
    return 'Változékony idő';
}

// --- FELHŐ MENTÉS ---
async function saveToCloud() {
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': MASTER_KEY
            },
            body: JSON.stringify({ inventory: inventory })
        });
        return res.ok;
    } catch (err) {
        console.error("Mentési hiba:", err);
        return false;
    }
}

// --- FELHŐ BETÖLTÉS ---
async function loadFromCloud(showAlert = false) {
    const statusBtn = document.getElementById('statusBtn');
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: { 'X-Master-Key': MASTER_KEY }
        });

        if (!res.ok) throw new Error("Szerver státusz: " + res.status);

        const data = await res.json();
        if (data && data.record && Array.isArray(data.record.inventory)) {
            const cloudData = data.record.inventory;
            
            if (cloudData.length === 0 && inventory.length > 0) {
                await saveToCloud();
            } else {
                inventory = cloudData;
                localStorage.setItem('muhely_leltar', JSON.stringify(inventory));
            }

            renderUI();
            statusBtn.style.backgroundColor = '#1b5e20';
            statusBtn.textContent = '☁️ Felhő szinkron aktív';
            if (showAlert) alert("Sikeres szinkronizálás a felhőből!");
        }
    } catch (err) {
        statusBtn.style.backgroundColor = '#b71c1c';
        statusBtn.textContent = '⚠️ Szinkron hiba';
        if (showAlert) alert("Nem sikerült kapcsolódni a felhőhöz!");
    }
}

// --- TÉTEL HOZZÁADÁSA ---
async function addItem(e) {
    if (e) e.preventDefault();
    const nameInput = document.getElementById('itemName');
    const qtyInput = document.getElementById('itemQty');
    const alertInput = document.getElementById('isMinAlert');

    const name = nameInput.value.trim();
    const qty = parseInt(qtyInput.value) || 1;

    if (!name) return;

    const existing = inventory.find(i => i.name.toLowerCase() === name.toLowerCase());
    if (existing) {
        existing.quantity = (existing.quantity ?? existing.qty ?? 0) + qty;
    } else {
        inventory.push({
            id: Date.now(),
            name: name,
            quantity: qty,
            isMinAlert: alertInput.checked
        });
    }

    localStorage.setItem('muhely_leltar', JSON.stringify(inventory));
    renderUI();

    nameInput.value = '';
    qtyInput.value = '1';

    await saveToCloud();
}

// --- TÉTEL KIVÉTELE ---
async function useItem() {
    const select = document.getElementById('useSelect');
    const qtyInput = document.getElementById('useQty');
    const id = parseInt(select.value);
    const qty = parseInt(qtyInput.value) || 1;

    const item = inventory.find(i => i.id === id);
    if (item) {
        const currentQty = item.quantity ?? item.qty ?? 0;
        if (currentQty < qty) {
            alert("Nincs ennyi tétel a raktáron!");
            return;
        }
        item.quantity = currentQty - qty;
        localStorage.setItem('muhely_leltar', JSON.stringify(inventory));
        renderUI();
        await saveToCloud();
    }
}

// --- TÉTEL TÖRLÉSE ---
async function deleteItem(id) {
    inventory = inventory.filter(i => i.id !== id);
    localStorage.setItem('muhely_leltar', JSON.stringify(inventory));
    renderUI();
    await saveToCloud();
}

// --- FÜLEK VÁLTÁSA ---
function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
}

// --- ROBUSZTUS RÁDIÓ LOGIKA ---
const audio = document.getElementById('radioAudio');
const playBtn = document.getElementById('playBtn');
const radioStatus = document.getElementById('radioStatus');
const externalRadioBtn = document.getElementById('externalRadioBtn');

function toggleRadio() {
    const select = document.getElementById('radioSelect');
    const currentStream = select.value;

    if (audio.paused) {
        radioStatus.textContent = 'Állapot: Csatlakozás...';
        
        // Frissítjük a forrást cache-elkerülő paraméterrel a beragadt adás ellen
        audio.src = currentStream + '?t=' + Date.now();

        audio.play().then(() => {
            playBtn.textContent = '⏸';
            radioStatus.textContent = 'Állapot: Lejátszás 🎵';
        }).catch(err => {
            console.error("Rádió lejátszási hiba:", err);
            playBtn.textContent = '▶';
            radioStatus.textContent = 'Állapot: Adó korlátozva / Hiba';
            alert("A kiválasztott adó közvetlen streamje nem indítható el (a szolgáltató korlátozása vagy böngésző tiltás miatt). Használd a lenti közvetlen gombot az adáshoz!");
        });
    } else {
        audio.pause();
        audio.src = ""; // Kapcsolat bontása a sávszélesség spórolásához
        playBtn.textContent = '▶';
        radioStatus.textContent = 'Állapot: Megállítva';
    }
}

function changeStream() {
    const select = document.getElementById('radioSelect');
    const selectedOption = select.options[select.selectedIndex];
    
    // Frissítjük a külső hivatalos hivatkozást
    const externalUrl = selectedOption.getAttribute('data-url');
    if (externalUrl) {
        externalRadioBtn.href = externalUrl;
    }

    if (!audio.paused) {
        audio.pause();
        audio.src = select.value + '?t=' + Date.now();
        radioStatus.textContent = 'Állapot: Váltás...';
        audio.play().then(() => {
            playBtn.textContent = '⏸';
            radioStatus.textContent = 'Állapot: Lejátszás 🎵';
        }).catch(err => {
            console.error("Adóváltási hiba:", err);
            playBtn.textContent = '▶';
            radioStatus.textContent = 'Állapot: Hiba a váltáskor';
        });
    } else {
        radioStatus.textContent = 'Állapot: Adó kiválasztva';
    }
}

function setVolume(val) {
    audio.volume = val;
}

function escapeHtml(str) {
    return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
}

// Oldal betöltésekor indítás
window.addEventListener('DOMContentLoaded', () => {
    renderUI();
    loadFromCloud(false);
    fetchWeather();
    audio.volume = 0.8;
});
</script>

</body>
</html>
