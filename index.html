<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    
    <title>Műhely Vezérlőpult</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #050505;
            --primary-orange: #d85900;
            --accent-red: #d32f2f;
            --text-white: #ffffff;
            --alert-yellow: #fff59d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #alert-bar {
            background-color: var(--alert-yellow);
            color: #000;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            padding: 5px 15px;
            display: none;
            width: 100%;
            border-bottom: 2px solid #e4d836;
        }

        .alert-item {
            margin: 0 10px;
            display: inline-block;
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid var(--primary-orange);
            background: linear-gradient(0deg, #1a0b00 0%, var(--bg-color) 100%);
        }

        header h1 {
            color: var(--primary-orange);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            padding: 20px;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--primary-orange);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(216, 89, 0, 0.2);
            border: 1px solid #ff7300;
        }

        .card h2 {
            margin-bottom: 15px;
            border-bottom: 2px solid var(--text-white);
            padding-bottom: 5px;
            font-weight: 800;
        }

        .tabs {
            display: flex;
            margin-bottom: 15px;
            background-color: #9c4000;
            border-radius: 5px;
            overflow: hidden;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-white);
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
            font-size: 0.85rem;
        }

        .tab-btn.active {
            background-color: #ff7300;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 10px; border: none; border-radius: 5px;
            background-color: var(--bg-color); color: var(--text-white); font-size: 1rem; outline: none;
        }

        .checkbox-group {
            display: flex; align-items: center; gap: 10px; font-size: 0.9rem; margin-bottom: 15px;
        }

        button.action-btn {
            width: 100%; padding: 12px; background-color: var(--bg-color); color: var(--primary-orange);
            border: 2px solid var(--bg-color); border-radius: 5px; font-size: 1.1rem; font-weight: 800;
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }

        button.action-btn:hover { background-color: var(--text-white); color: var(--primary-orange); }

        .inventory-list { max-height: 330px; overflow-y: auto; }
        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            background-color: rgba(0, 0, 0, 0.4); padding: 10px; border-radius: 5px; margin-bottom: 8px;
        }
        .item-info strong { font-size: 1.1rem; }
        .item-qty { font-size: 0.9rem; color: #ffcc99; }
        
        .delete-btn {
            background-color: var(--accent-red); color: var(--text-white); border: none;
            padding: 8px 12px; border-radius: 5px; cursor: pointer; transition: 0.3s;
        }
        .delete-btn:hover { background-color: #b71c1c; }

        .data-sync-box {
            display: flex;
            gap: 10px;
            border-top: 2px solid rgba(255,255,255,0.3);
            margin-top: 20px;
            padding-top: 15px;
        }

        .sync-btn {
            flex: 1;
            padding: 12px;
            background-color: var(--bg-color);
            color: var(--text-white);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.3s;
            text-align: center;
            text-decoration: none;
        }
        .sync-btn:hover { background-color: var(--text-white); color: var(--primary-orange); }

        .widget { margin-bottom: 20px; }
        .weather-info { display: flex; align-items: center; gap: 15px; font-size: 1.2rem; }
        .weather-icon { font-size: 2.5rem; }

        #radio-station {
            width: 100%; padding: 10px; margin-bottom: 15px; background-color: var(--bg-color);
            color: var(--primary-orange); border: 2px solid var(--bg-color); border-radius: 5px;
            font-size: 1rem; font-weight: 600; outline: none; cursor: pointer;
        }

        .radio-controls { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        
        .play-btn {
            width: 50px; height: 50px; border-radius: 50%; background-color: var(--bg-color);
            color: var(--primary-orange); border: none; font-size: 1.5rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        
        .volume-control { display: flex; align-items: center; gap: 10px; flex: 1; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--bg-color); }

        .fallback-btn {
            display: block; width: 100%; text-align: center; background-color: #1a0b00;
            color: var(--alert-yellow); padding: 10px; border-radius: 5px; text-decoration: none;
            font-size: 0.85rem; margin-top: 10px; border: 1px solid var(--alert-yellow);
        }
        .fallback-btn:hover { background-color: var(--alert-yellow); color: #000; }

    </style>
</head>
<body>

    <div id="alert-bar"></div>

    <header>
        <h1><i class="fa-solid fa-wrench"></i> Műhely Vezérlőpult</h1>
    </header>

    <main>
        <section class="card">
            <h2><i class="fa-solid fa-clipboard-list"></i> Leltár Rendszer</h2>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('add-tab', this)">Hozzáadás</button>
                <button class="tab-btn" onclick="switchTab('list-tab', this)">Lista</button>
                <button class="tab-btn" onclick="switchTab('use-tab', this)">Felhasználás</button>
            </div>

            <!-- Hozzáadás fül -->
            <div id="add-tab" class="tab-content active">
                <form id="inventory-form">
                    <div class="form-group">
                        <label for="item-name">Tétel megnevezése:</label>
                        <input type="text" id="item-name" placeholder="Pl.: 6x40-es facsavar" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="item-qty">Mennyiség (1 - 1000):</label>
                        <input type="number" id="item-qty" min="1" max="1000" value="1" required>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="item-bulk">
                        <label for="item-bulk">Ez egy fogyóeszköz (Figyelmeztessen, ha 15 db alá esik!)</label>
                    </div>
                    <button type="submit" class="action-btn"><i class="fa-solid fa-plus"></i> Hozzáadás a leltárhoz</button>
                </form>
            </div>

            <!-- Lista fül -->
            <div id="list-tab" class="tab-content">
                <div class="inventory-list" id="inventory-list"></div>
            </div>

            <!-- Felhasználás fül -->
            <div id="use-tab" class="tab-content">
                <form id="use-form">
                    <div class="form-group">
                        <label for="use-item-select">Válaszd ki a tételt:</label>
                        <select id="use-item-select" required></select>
                    </div>
                    <div class="form-group">
                        <label for="use-qty">Elhasznált mennyiség:</label>
                        <input type="number" id="use-qty" min="1" value="1" required>
                    </div>
                    <button type="submit" class="action-btn" style="background-color: var(--bg-color); color: var(--accent-red); border: 2px solid var(--accent-red);">
                        <i class="fa-solid fa-minus"></i> Levonás a leltárból
                    </button>
                </form>
            </div>

            <!-- Felhő Szinkron Gombok -->
            <div class="data-sync-box">
                <button class="sync-btn" onclick="loadFromCloud(true)"><i class="fa-solid fa-rotate"></i> Adatok frissítése felhőből</button>
                <div class="sync-btn" style="background-color: #1b5e20; cursor: default; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <i class="fa-solid fa-cloud"></i> Felhő szinkron aktív
                </div>
            </div>
        </section>

        <aside>
            <section class="card widget">
                <h2><i class="fa-solid fa-cloud-sun"></i> Atkár Időjárás</h2>
                <div class="weather-info" id="weather-info">
                    <span class="weather-icon"><i class="fa-solid fa-spinner fa-spin"></i></span>
                    <div>Adatok betöltése...</div>
                </div>
            </section>

            <section class="card widget">
                <h2><i class="fa-solid fa-radio"></i> Műhely Rádió</h2>
                
                <select id="radio-station" onchange="changeStation()">
                    <option value="https://icast.connectmedia.hu/5202/live.mp3">Rádió 1</option>
                    <option value="https://stream.retroradio.hu/high.mp3">Retro Rádió</option>
                    <option value="http://stream.radio88.hu:8000/radio88.mp3">Rádió 88</option>
                </select>

                <div class="radio-controls">
                    <button class="play-btn" id="play-btn" onclick="toggleRadio()">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <div class="volume-control">
                        <i class="fa-solid fa-volume-low"></i>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume(this.value)">
                        <i class="fa-solid fa-volume-high"></i>
                    </div>
                </div>
                <audio id="radio-player" referrerpolicy="no-referrer" preload="none"></audio>
                
                <a href="#" class="fallback-btn" onclick="window.open('https://myonlineradio.hu/radio-1', 'radioablak', 'width=450,height=600'); return false;">
                    <i class="fa-solid fa-external-link-alt"></i> Hivatalos Rádió 1 ablak megnyitása
                </a>
            </section>
        </aside>
    </main>

    <script>
        // Biztonságos Access Key konfiguráció
        // Konfiguráció Master Key-vel
        const BIN_ID = '6a822196da38895dfeec8197';
        const ACCESS_KEY = '$2a$10$6QowppR7Ydwg4uy2y0QaueS2z3g5GIkmndr94g4hQNMXuhjmXYC0';
        
        let inventory = [];

        async function loadFromCloud(showAlert = false) {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: {
                        'X-Master-Key': ACCESS_KEY
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Szerver hiba: ${response.status}`);
                }

                const data = await response.json();
                if (data && data.record && Array.isArray(data.record.inventory)) {
                    inventory = data.record.inventory;
                    saveAndRenderLocally();
                    if (showAlert) alert("Sikeres szinkronizálás a felhőből!");
                } else {
                    if (showAlert) alert("A felhőben lévő adatok formátuma nem megfelelő.");
                }
            } catch (err) {
                console.error("Hiba:", err);
                if (showAlert) alert("Nem sikerült kapcsolódni a felhőhöz: " + err.message);
                inventory = JSON.parse(localStorage.getItem('muhely_leltar')) || [];
                renderList();
                renderUseSelect();
                checkAlerts();
            }
        }

        async function saveToCloud() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': ACCESS_KEY
                    },
                    body: JSON.stringify({ inventory: inventory })
                });
            } catch (err) {
                console.error("Hiba a felhőbe mentéskor:", err);
            }
        }

        // Adatok mentése a felhőbe
        async function saveToCloud() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': ACCESS_KEY
                    },
                    body: JSON.stringify({ inventory: inventory })
                });
            } catch (err) {
                console.error("Hiba a felhőbe mentéskor:", err);
            }
        }

        // Adatok mentése a felhőbe
        async function saveToCloud() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Access-Key': ACCESS_KEY
                    },
                    body: JSON.stringify({ inventory: inventory })
                });
            } catch (err) {
                console.error("Hiba a felhőbe mentéskor:", err);
            }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        document.getElementById('item-name').addEventListener('input', function(e) {
            const val = e.target.value.toLowerCase();
            const bulkWords = ['csavar', 'tipli', 'szög', 'szeg', 'anya', 'alátét', 'dűbel', 'kötöző'];
            if (bulkWords.some(word => val.includes(word))) {
                document.getElementById('item-bulk').checked = true;
            }
        });

        document.getElementById('inventory-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('item-name').value.trim();
            const qty = parseInt(document.getElementById('item-qty').value);
            const isBulk = document.getElementById('item-bulk').checked;

            const existingIndex = inventory.findIndex(item => item.name.toLowerCase() === name.toLowerCase());
            
            if (existingIndex !== -1) {
                inventory[existingIndex].qty += qty;
                if(isBulk) inventory[existingIndex].isBulk = true;
            } else {
                inventory.push({ id: Date.now(), name, qty, isBulk });
            }

            saveAndRender();
            this.reset();
            switchTab('list-tab', document.querySelectorAll('.tab-btn')[1]);
        });

        document.getElementById('use-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const selectedId = parseInt(document.getElementById('use-item-select').value);
            const qtyToSubtract = parseInt(document.getElementById('use-qty').value);

            const item = inventory.find(i => i.id === selectedId);
            if (item) {
                if (item.qty < qtyToSubtract) {
                    alert(`Nincs ennyi a készleten! Jelenlegi mennyiség: ${item.qty} db`);
                    return;
                }
                item.qty -= qtyToSubtract;
                saveAndRender();
                this.reset();
                switchTab('list-tab', document.querySelectorAll('.tab-btn')[1]);
            }
        });

        function deleteItem(id) {
            inventory = inventory.filter(item => item.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('muhely_leltar', JSON.stringify(inventory));
            renderList();
            renderUseSelect();
            checkAlerts();
            saveToCloud();
        }

        function saveAndRenderLocally() {
            localStorage.setItem('muhely_leltar', JSON.stringify(inventory));
            renderList();
            renderUseSelect();
            checkAlerts();
        }

        function renderList() {
            const listDiv = document.getElementById('inventory-list');
            listDiv.innerHTML = '';
            const sortedInventory = [...inventory].sort((a, b) => a.name.localeCompare(b.name, 'hu'));
            if (sortedInventory.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; padding: 20px;">A leltár jelenleg üres.</p>';
                return;
            }
            sortedInventory.forEach(item => {
                const isLow = (item.isBulk && item.qty <= 15);
                listDiv.innerHTML += `
                    <div class="item-row" style="${isLow ? 'border-left: 4px solid var(--alert-yellow);' : ''}">
                        <div class="item-info">
                            <strong>${item.name}</strong><br>
                            <span class="item-qty">Mennyiség: ${item.qty} db</span>
                        </div>
                        <button class="delete-btn" onclick="deleteItem(${item.id})" title="Törlés">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            });
        }

        function renderUseSelect() {
            const select = document.getElementById('use-item-select');
            select.innerHTML = '';
            const sortedInventory = [...inventory].sort((a, b) => a.name.localeCompare(b.name, 'hu'));
            if (sortedInventory.length === 0) {
                select.innerHTML = '<option value="">Nincs elérhető tétel</option>';
                return;
            }
            sortedInventory.forEach(item => {
                select.innerHTML += `<option value="${item.id}">${item.name} (Készlet: ${item.qty} db)</option>`;
            });
        }

        function checkAlerts() {
            const alertBar = document.getElementById('alert-bar');
            alertBar.innerHTML = '';
            const lowItems = inventory.filter(item => item.isBulk && item.qty <= 15);
            if (lowItems.length > 0) {
                alertBar.style.display = 'block';
                let alertText = '<i class="fa-solid fa-triangle-exclamation"></i> <strong>BESZERZÉS SZÜKSÉGES:</strong> ';
                lowItems.forEach(item => {
                    alertText += `<span class="alert-item">${item.name} (${item.qty} db)</span>`;
                });
                alertBar.innerHTML = alertText;
            } else {
                alertBar.style.display = 'none';
            }
        }

        // Időjárás
        async function fetchWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=47.72&longitude=19.88&current=temperature_2m,weather_code&timezone=Europe%2FBudapest');
                const data = await response.json();
                const temp = Math.round(data.current.temperature_2m);
                const code = data.current.weather_code;
                
                let icon = 'fa-sun'; let desc = 'Derült';
                if (code >= 1 && code <= 3) { icon = 'fa-cloud-sun'; desc = 'Felhős'; }
                if (code >= 45 && code <= 48) { icon = 'fa-smog'; desc = 'Ködös'; }
                if (code >= 51 && code <= 67) { icon = 'fa-cloud-rain'; desc = 'Eső'; }
                if (code >= 71 && code <= 77) { icon = 'fa-snowflake'; desc = 'Hó'; }
                if (code >= 95) { icon = 'fa-cloud-bolt'; desc = 'Zivatar'; }

                document.getElementById('weather-info').innerHTML = `
                    <span class="weather-icon"><i class="fa-solid ${icon}"></i></span>
                    <div>
                        <strong>${temp} °C</strong><br>
                        <span style="font-size:0.9rem">${desc} (Atkár)</span>
                    </div>
                `;
            } catch (error) {
                document.getElementById('weather-info').innerHTML = '<span><i class="fa-solid fa-triangle-exclamation"></i> Hiba.</span>';
            }
        }

        // Rádió
        const audio = document.getElementById('radio-player');
        const playBtn = document.getElementById('play-btn');
        const stationSelect = document.getElementById('radio-station');
        let isPlaying = false;
        audio.volume = 0.5;

        function toggleRadio() {
            if (isPlaying) {
                audio.pause();
                playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                isPlaying = false;
            } else {
                audio.src = stationSelect.value;
                playBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                audio.play().then(() => {
                    playBtn.innerHTML = '<i class="fa-solid fa-stop"></i>';
                    isPlaying = true;
                }).catch(error => {
                    console.log(error);
                    alert("A böngésződ blokkolta ezt a csatornát. Használd a 'Hivatalos Rádió 1 ablak' gombot lejjebb!");
                    playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                    isPlaying = false;
                });
            }
        }

        function changeStation() {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                toggleRadio();
            }
        }

        function changeVolume(val) { audio.volume = val; }

        window.onload = () => {
            loadFromCloud();
            fetchWeather();
            setInterval(fetchWeather, 15 * 60 * 1000);
        };
    </script>
</body>
</html>
