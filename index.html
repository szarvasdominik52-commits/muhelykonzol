<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Műhely Leltár</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1, h2 {
            color: #ffffff;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        button.btn-sync {
            background-color: #28a745;
        }
        button.btn-sync:hover {
            background-color: #1e7e34;
        }
        button.btn-danger {
            background-color: #dc3545;
            padding: 4px 8px;
        }
        button.btn-danger:hover {
            background-color: #bd2130;
        }
        form, .use-section {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        input, select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #333;
            color: #fff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #2a2a2a;
        }
        .alert-box {
            background-color: #d9534f;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Műhely Leltár Rendszer</h1>

    <div id="alertBox" class="alert-box"></div>

    <div class="btn-group">
        <button class="btn-sync" onclick="loadFromCloud(true)">☁️ Szinkronizálás a felhőből</button>
        <button onclick="manualSaveToCloud()">💾 Mentés a felhőbe</button>
    </div>

    <!-- Új tétel hozzáadása -->
    <h2>Új tétel hozzáadása</h2>
    <form id="addForm" onsubmit="addItem(event)">
        <div class="form-group">
            <label for="itemName">Tétel neve:</label>
            <input type="text" id="itemName" required placeholder="pl. M6 Csavar">
        </div>
        <div class="form-group">
            <label for="itemQty">Mennyiség:</label>
            <input type="number" id="itemQty" min="1" value="1" required>
        </div>
        <div class="form-group">
            <label for="itemMinQty">Minimális készlet (értesítéshez):</label>
            <input type="number" id="itemMinQty" min="0" value="0">
        </div>
        <button type="submit">➕ Hozzáadás a leltárhoz és felhőbe</button>
    </form>

    <!-- Tétel felhasználása -->
    <h2>Tétel használata / csökkentése</h2>
    <div class="use-section">
        <div class="form-group">
            <label for="useSelect">Válassz tételt:</label>
            <select id="useSelect"><option value="">-- Válassz --</option></select>
        </div>
        <div class="form-group">
            <label for="useQty">Levonandó mennyiség:</label>
            <input type="number" id="useQty" min="1" value="1">
        </div>
        <button onclick="useItem()">➖ Kivétel a leltárból</button>
    </div>

    <!-- Leltár lista -->
    <h2>Készlet lista</h2>
    <table>
        <thead>
            <tr>
                <th>Név</th>
                <th>Mennyiség</th>
                <th>Min. Készlet</th>
                <th>Művelet</th>
            </tr>
        </thead>
        <tbody id="inventoryList">
            <!-- Dinamikusan feltöltve JS-ből -->
        </tbody>
    </table>
</div>

<script>
// --- KONFIGURÁCIÓ ---
const BIN_ID = '6a822196da38895dfeec8197';
const ACCESS_KEY = '$2a$10$6QowppR7Ydwg4uy2y0QaueS2z3g5GIkmndr94g4HQNMXuhjmXYC0';

// HA Access Key-t használsz, ezt írd át 'X-Access-Key'-re!
const KEY_HEADER = 'X-Master-Key'; 

let inventory = JSON.parse(localStorage.getItem('muhely_leltar')) || [];

// --- HOZZÁADÁS A LELTÁRHOZ ÉS FELHŐBE ---
async function addItem(event) {
    if (event) event.preventDefault();

    const nameInput = document.getElementById('itemName');
    const qtyInput = document.getElementById('itemQty');
    const minQtyInput = document.getElementById('itemMinQty');

    const name = nameInput.value.trim();
    const quantity = parseInt(qtyInput.value) || 1;
    const minQuantity = parseInt(minQtyInput.value) || 0;

    if (!name) return;

    const existingItem = inventory.find(i => i.name.toLowerCase() === name.toLowerCase());

    if (existingItem) {
        existingItem.quantity += quantity;
        if (minQuantity > 0) existingItem.minQuantity = minQuantity;
    } else {
        inventory.push({
            id: Date.now(),
            name: name,
            quantity: quantity,
            minQuantity: minQuantity
        });
    }

    // 1. Helyi frissítés
    saveAndRenderLocally();
    renderList();
    renderUseSelect();
    checkAlerts();

    // 2. Beviteli mezők kiürítése
    nameInput.value = '';
    qtyInput.value = '1';
    minQtyInput.value = '0';

    // 3. AZONNALI FELKÜLDÉS A FELHŐBE A HOZZÁADÁS GOMBBAL
    await saveToCloud();
}

// --- TÉTEL HASZNÁLATA / CSÖKKENTÉSE ---
async function useItem() {
    const select = document.getElementById('useSelect');
    const qtyInput = document.getElementById('useQty');
    const itemId = parseInt(select.value);
    const qtyToUse = parseInt(qtyInput.value) || 1;

    if (!itemId) {
        alert("Kérlek válassz ki egy tételt!");
        return;
    }

    const item = inventory.find(i => i.id === itemId);
    if (item) {
        if (item.quantity < qtyToUse) {
            alert("Nincs ennyi tétel a raktáron!");
            return;
        }
        item.quantity -= qtyToUse;
        saveAndRenderLocally();
        renderList();
        renderUseSelect();
        checkAlerts();

        await saveToCloud();
    }
}

// --- TÉTEL TÖRLÉSE ---
async function deleteItem(id) {
    if (confirm("Biztosan törölni szeretnéd ezt a tételt?")) {
        inventory = inventory.filter(i => i.id !== id);
        saveAndRenderLocally();
        renderList();
        renderUseSelect();
        checkAlerts();

        await saveToCloud();
    }
}

// --- HELYI MENTÉS ---
function saveAndRenderLocally() {
    localStorage.setItem('muhely_leltar', JSON.stringify(inventory));
}

// --- MENTÉS A FELHŐBE ---
async function saveToCloud() {
    try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                [KEY_HEADER]: ACCESS_KEY
            },
            body: JSON.stringify({ inventory: inventory })
        });

        if (!response.ok) {
            console.error("Felhő mentési hiba, státusz:", response.status);
            return false;
        }
        console.log("Sikeresen felküldve a felhőbe!");
        return true;
    } catch (err) {
        console.error("Hálózati hiba mentéskor:", err);
        return false;
    }
}

async function manualSaveToCloud() {
    const success = await saveToCloud();
    if (success) {
        alert("Sikeresen elmentve a felhőbe!");
    } else {
        alert("Hiba történt a felhőbe mentés során.");
    }
}

// --- BETÖLTÉS A FELHŐBŐL ---
async function loadFromCloud(showAlert = false) {
    try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
            headers: {
                [KEY_HEADER]: ACCESS_KEY
            }
        });

        if (!response.ok) {
            throw new Error(`Szerver hiba: ${response.status}`);
        }

        const data = await response.json();

        if (data && data.record && Array.isArray(data.record.inventory)) {
            const cloudInventory = data.record.inventory;
            const localInventory = JSON.parse(localStorage.getItem('muhely_leltar')) || [];

            // Védelem: Ha a felhő üres, de helyben vannak adatok, nem töröljük le, hanem feltöltjük!
            if (cloudInventory.length === 0 && localInventory.length > 0) {
                inventory = localInventory;
                await saveToCloud();
                if (showAlert) alert("A felhő üres volt, a helyi adatok megmaradtak és automatikusan felmentek a felhőbe!");
            } else {
                inventory = cloudInventory;
                saveAndRenderLocally();
                if (showAlert) alert("Sikeres szinkronizálás a felhőből!");
            }

            renderList();
            renderUseSelect();
            checkAlerts();
        } else {
            if (showAlert) alert("A felhőben lévő adatok formátuma nem megfelelő.");
        }
    } catch (err) {
        console.error("Hiba szinkronizáláskor:", err);
        if (showAlert) alert("Nem sikerült kapcsolódni a felhőhöz: " + err.message);
        inventory = JSON.parse(localStorage.getItem('muhely_leltar')) || [];
        renderList();
        renderUseSelect();
        checkAlerts();
    }
}

// --- MEGJELENÍTŐ FÜGGVÉNYEK ---
function renderList() {
    const tbody = document.getElementById('inventoryList');
    tbody.innerHTML = '';

    if (inventory.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">A leltár üres.</td></tr>';
        return;
    }

    inventory.forEach(item => {
        const tr = document.createElement('tr');
        const isLow = item.minQuantity && item.quantity <= item.minQuantity;

        tr.innerHTML = `
            <td><strong>${escapeHtml(item.name)}</strong></td>
            <td style="color: ${isLow ? '#ff6b6b' : '#e0e0e0'}; font-weight: ${isLow ? 'bold' : 'normal'};">
                ${item.quantity} ${isLow ? '⚠️ (Kevés)' : ''}
            </td>
            <td>${item.minQuantity || 0}</td>
            <td>
                <button class="btn-danger" onclick="deleteItem(${item.id})">Törlés</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function renderUseSelect() {
    const select = document.getElementById('useSelect');
    select.innerHTML = '<option value="">-- Válassz tételt --</option>';

    inventory.forEach(item => {
        const option = document.createElement('option');
        option.value = item.id;
        option.textContent = `${item.name} (${item.quantity} db)`;
        select.appendChild(option);
    });
}

function checkAlerts() {
    const alertBox = document.getElementById('alertBox');
    const lowStockItems = inventory.filter(i => i.minQuantity && i.quantity <= i.minQuantity);

    if (lowStockItems.length > 0) {
        const itemNames = lowStockItems.map(i => `${i.name} (${i.quantity} db)`).join(', ');
        alertBox.style.display = 'block';
        alertBox.innerHTML = `⚠️ <strong>Kevés a készlet a következő elemekből:</strong> ${escapeHtml(itemNames)}`;
    } else {
        alertBox.style.display = 'none';
    }
}

function escapeHtml(str) {
    return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
}

// Oldal betöltésekor automatikus szinkronizálás és megjelenítés
window.addEventListener('DOMContentLoaded', () => {
    renderList();
    renderUseSelect();
    checkAlerts();
    loadFromCloud(false);
});
</script>

</body>
</html>
